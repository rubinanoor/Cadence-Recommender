<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadence - Music Recommendation</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      background: linear-gradient(to right, #141e30, #243b55);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
      background-color: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      margin-bottom: 1.5rem !important; 


    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn-custom {
      background: #fdd835;
      color: #000;
      border-radius: 12px;
      padding: 10px 25px;
      border: none;
      font-weight: bold;
    }

    .btn-custom:hover {
      background: #ffeb3b;
    }

    .results-container {
      margin-top: 25px;
      text-align: left;
    }

    .result-item {
      background: rgba(255, 255, 255, 0.07);
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      transition: transform 0.2s ease;
    }

    .result-item:hover {
      transform: translateY(-2px);
      background-color: rgba(255, 255, 255, 0.15);
    }

    .spinner-border {
      margin-top: 20px;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <h2 class="mb-4"><i class="fas fa-music"></i> Cadence Recommender</h2>
    <form id="searchForm" method="POST">
      <input type="text" id="song" name="song" class="form-control mb-3" placeholder="🎵 Song name" required />
      <input type="text" id="artist" name="artist" class="form-control mb-3" placeholder="🎤 Artist name" required />
      <button type="submit" class="btn btn-custom w-100">Get Recommendations</button>
    </form>
    <div id="loading" class="text-center d-none">
      <div class="spinner-border text-light" role="status"></div>
    </div>
    <div id="results" class="results-container"></div>
  </div>

  <!-- Toasts -->
  <div class="toast align-items-center text-white bg-danger border-0" id="errorToast" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="errorToastMsg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('searchForm');
    const resultsDiv = document.getElementById('results');
    const loading = document.getElementById('loading');
    const errorToast = new bootstrap.Toast(document.getElementById('errorToast'));

    form.onsubmit = function (e) {
      e.preventDefault();
      const formData = new FormData(form);
      resultsDiv.innerHTML = '';
      loading.classList.remove('d-none');

      fetch('/recommend', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        loading.classList.add('d-none');
        resultsDiv.innerHTML = '';

        if (data.error) {
          showError(data.error);
        } else if (data.length === 0) {
          showError("No recommendations found.");
        } else {
          data.forEach((song, i) => {
            resultsDiv.innerHTML += `
              <div class="result-item">
                <strong>${i + 1}.</strong> ${song.track_name} by ${song.artist_name}
              </div>`;
          });
        }
      })
      .catch(() => {
        loading.classList.add('d-none');
        showError("Server error. Please try again.");
      });
    };

    function showError(message) {
      document.getElementById('errorToastMsg').innerText = message;
      errorToast.show();
    }
  </script>
</body>
</html>
